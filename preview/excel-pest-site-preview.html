<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel Pest — full site preview</title>
<style>
/* =========================================================================
   Austin Excel Pest & Lawn Control — global stylesheet
   Brand: deep navy blue + orange
   Single source of truth for colour, type, and layout tokens.
   ========================================================================= */

:root {
  /* Brand colours — exact values from the Excel Pest developer brief (Part 1, 1.1) */
  --navy:        #10315B;   /* --color-primary */
  --navy-dark:   #0A1F3C;   /* --color-primary-dark */
  --navy-light:  #2C5A96;   /* --color-primary-light */
  --orange:      #E8761A;   /* --color-accent (CTA only) */
  --orange-dark: #C25C0B;   /* --color-accent-dark */

  /* Neutrals */
  --ink:      #16202E;      /* --color-ink */
  --body:     #2A3646;      /* readable dark for large body copy */
  --muted:    #5B6878;      /* --color-muted */
  --line:     #DCE3EB;      /* --color-border */
  --bg:       #FFFFFF;      /* --color-bg */
  --bg-soft:  #F4F7FA;      /* --color-surface */
  --bg-navy-tint: #E4EAF2;

  /* Status + utility */
  --success:  #1E7A46;
  --warning:  #B3841A;
  --overlay:  rgba(10, 31, 60, 0.62);

  /* Type — Barlow Condensed headings + Source Sans 3 body (brief 1.x Fonts) */
  --font-heading: "Barlow Condensed", "Segoe UI", Roboto, Arial, sans-serif;
  --font-body: "Source Sans 3", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-sans: var(--font-body);

  /* Layout */
  --maxw: 1120px;
  --radius: 10px;
  --shadow: 0 6px 24px rgba(16, 49, 91, 0.10);
  --shadow-lg: 0 16px 48px rgba(16, 49, 91, 0.16);
}

*,
*::before,
*::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font-sans);
  color: var(--body);
  background: var(--bg);
  line-height: 1.65;
  font-size: 17px;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--font-heading);
  color: var(--ink);
  line-height: 1.1;
  margin: 0 0 0.5em;
  font-weight: 600;
  letter-spacing: .005em;
}

h1 { font-size: clamp(2.3rem, 5.6vw, 3.5rem); font-weight: 700; }
h2 { font-size: clamp(1.8rem, 3.8vw, 2.5rem); }
h3 { font-size: 1.35rem; }

p { margin: 0 0 1rem; }

a { color: var(--orange-dark); text-decoration: none; }
a:hover { text-decoration: underline; }

img { max-width: 100%; height: auto; display: block; }

.container {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: 0 20px;
}

.section { padding: 72px 0; }
.section--soft { background: var(--bg-soft); }
.section--navy { background: var(--navy); color: #cdd6e6; }
.section--navy h2,
.section--navy h3 { color: #fff; }

.eyebrow {
  display: inline-block;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--orange);
  margin-bottom: 0.6rem;
}

.lead { font-size: 1.15rem; color: var(--body); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-block;
  padding: 14px 26px;
  border-radius: var(--radius);
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 1.05rem;
  letter-spacing: .02em;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform .06s ease, background .2s ease, color .2s ease;
  text-align: center;
}
.btn:hover { text-decoration: none; transform: translateY(-1px); }
.btn--primary { background: var(--orange); color: #fff; border-color: var(--orange); }
.btn--primary:hover { background: var(--orange-dark); border-color: var(--orange-dark); }
.btn--ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
.btn--ghost:hover { background: #fff; color: var(--navy); }
.btn--outline { background: transparent; color: var(--navy); border-color: var(--navy); }
.btn--outline:hover { background: var(--navy); color: #fff; }

/* ---------- Header ---------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--navy);
  color: #fff;
}
.topbar {
  background: var(--navy-dark);
  font-size: 0.86rem;
}
.topbar .container {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding-top: 6px;
  padding-bottom: 6px;
  color: #b9c4da;
  flex-wrap: wrap;
}
.topbar a { color: #fff; font-weight: 600; }
.topbar a:hover { color: var(--orange); text-decoration: none; }

.navbar .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 14px;
  padding-bottom: 14px;
  gap: 16px;
}
.brand {
  display: flex;
  flex-direction: column;
  color: #fff;
  line-height: 1.1;
}
.brand:hover { text-decoration: none; }
.brand__name { font-family: var(--font-heading); font-weight: 700; font-size: 1.3rem; letter-spacing: .01em; }
.brand__tag { font-size: 0.72rem; color: var(--orange); text-transform: uppercase; letter-spacing: .12em; }

.nav-links {
  display: flex;
  align-items: center;
  gap: 24px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.nav-links a {
  color: #e7ecf6;
  font-weight: 600;
  font-size: 0.98rem;
}
.nav-links a:hover { color: var(--orange); text-decoration: none; }
.nav-cta { display: flex; gap: 10px; align-items: center; }
.nav-invoice {
  border: 1px solid rgba(255,255,255,.4);
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 0.9rem;
  color: #fff;
}
.nav-invoice:hover { border-color: var(--orange); color: var(--orange); text-decoration: none; }

.nav-toggle {
  display: none;
  background: transparent;
  border: 0;
  color: #fff;
  font-size: 1.6rem;
  cursor: pointer;
}

/* ---------- Hero ---------- */
.hero {
  background:
    linear-gradient(120deg, rgba(10,31,60,.92), rgba(16,49,91,.78)),
    radial-gradient(circle at 80% 20%, rgba(232,118,26,.25), transparent 45%);
  color: #fff;
  padding: 96px 0;
}
.hero h1 { color: #fff; max-width: 16ch; }
.hero p { color: #d7deec; font-size: 1.2rem; max-width: 52ch; }
.hero__actions { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 28px; }
.hero__note { margin-top: 18px; font-size: .92rem; color: #aeb9d0; }

/* ---------- Cards / grid ---------- */
.grid { display: grid; gap: 22px; }
.grid--3 { grid-template-columns: repeat(3, 1fr); }
.grid--2 { grid-template-columns: repeat(2, 1fr); }

.card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: var(--shadow);
}
.card h3 { margin-bottom: .4rem; }
.card__icon {
  width: 46px; height: 46px;
  border-radius: 10px;
  background: var(--bg-navy-tint);
  color: var(--navy);
  display: grid; place-items: center;
  font-size: 1.4rem;
  margin-bottom: 14px;
}
.card__link { font-weight: 700; }

/* ---------- Feature / split ---------- */
.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  align-items: center;
}

/* ---------- Steps ---------- */
.steps { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; counter-reset: step; }
.step { position: relative; padding-left: 4px; }
.step__num {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--orange); color: #fff; font-weight: 800;
  display: grid; place-items: center; margin-bottom: 12px;
}

/* ---------- CTA band (navy, per brief: orange is CTA-only) ---------- */
.cta-band { background: var(--navy); color: #d7deec; border-top: 4px solid var(--orange); }
.cta-band h2 { color: #fff; }
.cta-band .container {
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px; flex-wrap: wrap; padding-top: 44px; padding-bottom: 44px;
}
.cta-band .btn--ghost { border-color: #fff; }
.cta-band .btn--ghost:hover { background: #fff; color: var(--orange-dark); }

/* ---------- Cross-link block ---------- */
.crosslink {
  border: 1px dashed var(--line);
  background: var(--bg-soft);
  border-radius: var(--radius);
  padding: 24px 28px;
}
.crosslink strong { color: var(--ink); }

/* ---------- Footer ---------- */
.site-footer { background: var(--navy-dark); color: #aab6cf; padding: 56px 0 28px; }
.site-footer h4 { color: #fff; font-size: .95rem; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 14px; }
.footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1.2fr; gap: 32px; }
.site-footer a { color: #cdd6e6; }
.site-footer a:hover { color: var(--orange); text-decoration: none; }
.footer-links { list-style: none; margin: 0; padding: 0; }
.footer-links li { margin-bottom: 8px; }
.footer-bottom {
  border-top: 1px solid rgba(255,255,255,.1);
  margin-top: 36px; padding-top: 20px;
  font-size: .85rem; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}

/* ---------- Page hero (interior) ---------- */
.page-hero { background: var(--navy); color: #fff; padding: 64px 0; }
.page-hero h1 { color: #fff; margin-bottom: .3rem; }
.page-hero p { color: #cdd6e6; max-width: 60ch; }
.breadcrumb { font-size: .85rem; color: #9fb0cf; margin-bottom: 12px; }
.breadcrumb a { color: #cdd6e6; }

/* ---------- Contact ---------- */
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.info-list { list-style: none; margin: 0; padding: 0; }
.info-list li { margin-bottom: 18px; }
.info-list .label { display:block; font-size:.8rem; text-transform:uppercase; letter-spacing:.1em; color: var(--muted); }
.info-list .value { font-size: 1.15rem; color: var(--ink); font-weight: 700; }

.field { margin-bottom: 16px; }
.field label { display:block; font-weight:600; color: var(--ink); margin-bottom:6px; }
.field input, .field textarea, .field select {
  width: 100%; padding: 12px 14px; border: 1px solid var(--line);
  border-radius: 8px; font: inherit; color: var(--ink); background: #fff;
}
.field input:focus, .field textarea:focus { outline: 2px solid var(--orange); border-color: var(--orange); }

/* ---------- Utilities ---------- */
.text-center { text-align: center; }
.mt-0 { margin-top: 0; }
.mb-0 { margin-bottom: 0; }
.stack > * + * { margin-top: 1rem; }
.pill {
  display:inline-block; background: var(--bg-navy-tint); color: var(--navy);
  font-size:.8rem; font-weight:700; padding:4px 12px; border-radius:999px;
}

/* ---------- Trust bar ---------- */
.trust-bar { background: var(--navy-dark); color: #cdd6e6; }
.trust-bar .container {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 34px;
  padding-top: 16px; padding-bottom: 16px; font-size: .92rem; font-weight: 600;
}
.trust-bar b { color: #fff; }
.trust-bar .star { color: #ffb400; }

/* ---------- Badges ---------- */
.badges { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
  color: #eaf0fb; padding: 8px 14px; border-radius: 999px; font-size: .86rem; font-weight: 600;
}

/* ---------- Grid 4 ---------- */
.grid--4 { grid-template-columns: repeat(4, 1fr); }

/* ---------- Service/link cards row ---------- */
.card--link { display: flex; flex-direction: column; }
.card--link .card__link { margin-top: auto; padding-top: 10px; }

/* ---------- Reviews ---------- */
.stars { color: #ffb400; font-size: 1.1rem; letter-spacing: 2px; }
.review-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 26px; box-shadow: var(--shadow); }
.review-card blockquote { margin: 10px 0 14px; padding: 0; border: 0; font-size: 1.08rem; color: var(--ink); font-style: normal; background: none; }
.review-card cite { font-style: normal; font-weight: 700; color: var(--navy); }
.review-card .meta { color: var(--muted); font-size: .88rem; }
.big-rating { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.big-rating .num { font-size: 3rem; font-weight: 800; color: var(--navy); line-height: 1; }

/* ---------- City grid ---------- */
.city-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; list-style: none; margin: 0; padding: 0; }
.city-grid a, .city-grid span {
  display: block; padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px;
  background: #fff; font-weight: 600; color: var(--ink); font-size: .95rem;
}
.city-grid a:hover { border-color: var(--orange); color: var(--orange-dark); text-decoration: none; }
.city-grid span { color: var(--muted); font-weight: 500; }
@media (max-width: 820px) { .city-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 460px) { .city-grid { grid-template-columns: 1fr; } }

/* ---------- Offer strip ---------- */
.offer-strip {
  background: linear-gradient(90deg, var(--navy), var(--navy-light));
  color: #fff; border-radius: var(--radius); padding: 26px 30px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
}
.offer-strip h3 { color: #fff; margin: 0; }
.offer-strip .pct { font-size: 2.4rem; font-weight: 800; color: var(--orange); }

/* ---------- Hours table ---------- */
.hours { list-style: none; margin: 0; padding: 0; }
.hours li { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); }
.hours li:last-child { border-bottom: 0; }
.hours .day { color: var(--body); }
.hours .time { font-weight: 700; color: var(--ink); }

/* ---------- Prose helper for long copy ---------- */
.prose h2 { margin-top: 1.6em; }
.prose h3 { margin-top: 1.3em; color: var(--navy); }
.prose ul { padding-left: 20px; }
.prose li { margin-bottom: 7px; }
.callout {
  border-left: 4px solid var(--orange); background: var(--bg-soft);
  padding: 16px 20px; border-radius: 0 8px 8px 0; margin: 20px 0;
}

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .grid--4 { grid-template-columns: repeat(2, 1fr); }
  .grid--3, .steps { grid-template-columns: 1fr 1fr; }
  .split, .contact-grid { grid-template-columns: 1fr; gap: 28px; }
  .footer-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 640px) {
  .grid--3, .grid--2, .grid--4, .steps { grid-template-columns: 1fr; }
  .footer-grid { grid-template-columns: 1fr; }
  .offer-strip { flex-direction: column; text-align: center; }
  .nav-links {
    display: none; position: absolute; top: 100%; left: 0; right: 0;
    background: var(--navy); flex-direction: column; align-items: flex-start;
    padding: 18px 20px; gap: 14px; box-shadow: var(--shadow-lg);
  }
  .nav-links.open { display: flex; }
  .navbar .container { position: relative; }
  .nav-toggle { display: block; }
  .topbar .container { justify-content: center; }
  .cta-band .container { flex-direction: column; text-align: center; }
}

/* =========================================================================
   MOTION + INTERACTIVE LAYER
   ========================================================================= */

/* Scroll progress bar */
.scroll-progress {
  position: fixed; top: 0; left: 0; height: 3px; width: 0%;
  background: linear-gradient(90deg, var(--orange), #ffa24d);
  z-index: 100; transition: width .1s linear;
}

/* Header shrink on scroll */
.site-header { transition: box-shadow .3s ease; }
.site-header.is-stuck { box-shadow: 0 10px 30px rgba(10,31,60,.35); }
.site-header.is-stuck .topbar { max-height: 0; padding: 0; overflow: hidden; opacity: 0; }
.topbar { transition: max-height .3s ease, padding .3s ease, opacity .3s ease; max-height: 60px; }
.site-header.is-stuck .navbar .container { padding-top: 9px; padding-bottom: 9px; }
.navbar .container { transition: padding .3s ease; }

/* Scroll reveal */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); will-change: opacity, transform; }
.reveal.in { opacity: 1; transform: none; }
.reveal.d1 { transition-delay: .08s; } .reveal.d2 { transition-delay: .16s; }
.reveal.d3 { transition-delay: .24s; } .reveal.d4 { transition-delay: .32s; }

/* ---------- Cinematic hero ---------- */
.hero { position: relative; overflow: hidden; }
.hero__bg { position: absolute; inset: 0; z-index: 0; }
.hero__bg::before {
  content: ""; position: absolute; inset: -30%;
  background:
    radial-gradient(40% 40% at 20% 30%, rgba(232,118,26,.35), transparent 60%),
    radial-gradient(45% 45% at 85% 20%, rgba(37,86,168,.55), transparent 60%),
    radial-gradient(50% 50% at 60% 90%, rgba(232,118,26,.18), transparent 60%);
  animation: heroDrift 18s ease-in-out infinite alternate;
}
@keyframes heroDrift {
  0%   { transform: translate3d(0,0,0) scale(1); }
  50%  { transform: translate3d(-3%,2%,0) scale(1.08); }
  100% { transform: translate3d(2%,-2%,0) scale(1.04); }
}
.hero__orb { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .5; z-index: 0;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.5), rgba(255,162,77,.15) 40%, transparent 70%); }
.hero__orb.o1 { width: 220px; height: 220px; top: 8%;  right: 10%; animation: float 9s ease-in-out infinite; }
.hero__orb.o2 { width: 130px; height: 130px; bottom: 12%; left: 8%; animation: float 12s ease-in-out infinite reverse; }
.hero__orb.o3 { width: 70px;  height: 70px;  top: 40%; left: 45%; animation: float 7s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0) translateX(0); } 50% { transform: translateY(-26px) translateX(12px); } }
.hero .container { position: relative; z-index: 1; }
.hero__cue { margin-top: 34px; display: inline-flex; align-items: center; gap: 10px; color: #aeb9d0; font-size: .85rem; }
.hero__cue .chev { width: 22px; height: 22px; border: 2px solid currentColor; border-radius: 50%; display: grid; place-items: center; animation: bob 1.6s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

/* Hero entrance stagger */
.hero .anim-up { opacity: 0; transform: translateY(24px); animation: heroUp .8s cubic-bezier(.2,.7,.2,1) forwards; }
.hero .anim-up.s1 { animation-delay: .05s; } .hero .anim-up.s2 { animation-delay: .18s; }
.hero .anim-up.s3 { animation-delay: .31s; } .hero .anim-up.s4 { animation-delay: .44s; } .hero .anim-up.s5 { animation-delay: .57s; }
@keyframes heroUp { to { opacity: 1; transform: none; } }

/* ---------- Stat band (count-up) ---------- */
.statband { background: var(--navy-dark); color: #fff; }
.statband .container { display: grid; grid-template-columns: repeat(5,1fr); gap: 20px; padding: 40px 20px; text-align: center; }
.statband .stat__num { font-size: clamp(1.8rem, 4vw, 2.9rem); font-weight: 800; color: #fff; line-height: 1; letter-spacing: -.02em; }
.statband .stat__num .u { color: var(--orange); }
.statband .stat__lbl { margin-top: 8px; font-size: .82rem; text-transform: uppercase; letter-spacing: .08em; color: #9fb0cf; }
@media (max-width: 780px){ .statband .container { grid-template-columns: repeat(2,1fr); gap: 26px; } }

/* ---------- Pest identifier ---------- */
.identifier { display: grid; grid-template-columns: 1.05fr 1fr; gap: 34px; align-items: start; }
.pest-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.pest-btn {
  background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 10px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 8px; font-weight: 700; color: var(--ink);
  font-size: .92rem; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
.pest-btn .emo { font-size: 1.9rem; line-height: 1; transition: transform .2s ease; }
.pest-btn:hover { transform: translateY(-3px); border-color: var(--orange); box-shadow: var(--shadow); }
.pest-btn:hover .emo { transform: scale(1.15) rotate(-6deg); }
.pest-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.pest-panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 30px; box-shadow: var(--shadow); min-height: 260px; }
.pest-panel .emo-lg { font-size: 3rem; }
.pest-panel h3 { margin: 10px 0 6px; }
.pest-panel .fade-swap { animation: fadeSwap .4s ease; }
@keyframes fadeSwap { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (max-width: 820px){ .identifier { grid-template-columns: 1fr; } .pest-grid { grid-template-columns: repeat(4,1fr); } }
@media (max-width: 520px){ .pest-grid { grid-template-columns: repeat(3,1fr); } }

/* ---------- Service-area checker ---------- */
.checker { max-width: 620px; margin: 0 auto; }
.checker__row { display: flex; gap: 10px; }
.checker input { flex: 1; padding: 15px 18px; border-radius: 10px; border: 1px solid var(--line); font: inherit; }
.checker input:focus { outline: 2px solid var(--orange); border-color: var(--orange); }
.checker__result { margin-top: 16px; font-size: 1.05rem; min-height: 28px; }
.checker__result.hit { color: #1a7a3c; font-weight: 700; }
.checker__result.miss { color: var(--body); }
.checker__result .chip { display: inline-block; background: var(--bg-navy-tint); color: var(--navy); padding: 3px 12px; border-radius: 999px; font-weight: 700; }
@media (max-width: 520px){ .checker__row { flex-direction: column; } }

/* ---------- Testimonial spotlight ---------- */
.spotlight { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 40px; overflow: hidden; }
.spotlight__slide { display: none; }
.spotlight__slide.on { display: block; animation: fadeSwap .5s ease; }
.spotlight__q { font-size: 1.35rem; line-height: 1.5; color: var(--ink); font-weight: 600; margin: 10px 0 18px; }
.spotlight__dots { display: flex; gap: 8px; margin-top: 18px; }
.spotlight__dots button { width: 10px; height: 10px; border-radius: 50%; border: 0; background: var(--line); cursor: pointer; padding: 0; }
.spotlight__dots button.on { background: var(--orange); width: 26px; border-radius: 5px; transition: width .2s ease; }

/* ---------- Steps / how it works ---------- */
.flow { display: grid; grid-template-columns: repeat(3,1fr); gap: 22px; position: relative; }
.flow .step { background:#fff; border:1px solid var(--line); border-radius:14px; padding:26px; box-shadow: var(--shadow); }
.flow .step__num { width: 46px; height: 46px; }
@media (max-width: 780px){ .flow { grid-template-columns: 1fr; } }

/* ---------- FAQ accordion ---------- */
.accordion { max-width: 820px; margin: 0 auto; }
.acc-item { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; background: #fff; overflow: hidden; }
.acc-head { width: 100%; text-align: left; background: none; border: 0; cursor: pointer; padding: 20px 24px;
  font-size: 1.08rem; font-weight: 700; color: var(--ink); display: flex; justify-content: space-between; gap: 16px; align-items: center; }
.acc-head:hover { color: var(--orange-dark); }
.acc-head .ic { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; background: var(--bg-navy-tint); color: var(--navy);
  display: grid; place-items: center; font-size: 1.2rem; transition: transform .3s ease, background .2s ease, color .2s ease; }
.acc-item.open .acc-head .ic { transform: rotate(45deg); background: var(--orange); color: #fff; }
.acc-body { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
.acc-body__inner { padding: 0 24px 22px; color: var(--body); }

/* ---------- Back to top ---------- */
.to-top { position: fixed; right: 20px; bottom: 20px; width: 48px; height: 48px; border-radius: 50%;
  background: var(--navy); color: #fff; border: 0; cursor: pointer; font-size: 1.3rem; box-shadow: var(--shadow-lg);
  opacity: 0; visibility: hidden; transform: translateY(12px); transition: all .3s ease; z-index: 60; }
.to-top.show { opacity: 1; visibility: visible; transform: none; }
.to-top:hover { background: var(--orange); }

/* ---------- Mobile action bar ---------- */
.mobile-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; display: none;
  grid-template-columns: 1fr 1fr; gap: 0; box-shadow: 0 -6px 24px rgba(10,31,60,.25); }
.mobile-bar a { padding: 15px 10px; text-align: center; font-weight: 700; color: #fff; }
.mobile-bar a:hover { text-decoration: none; }
.mobile-bar .mb-call { background: var(--navy); }
.mobile-bar .mb-quote { background: var(--orange); }
@media (max-width: 680px){ .mobile-bar { display: grid; } body { padding-bottom: 54px; } .to-top { bottom: 66px; } }

/* Card hover lift (bolder) */
.card, .review-card { transition: transform .18s ease, box-shadow .18s ease; }
.grid .card:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .hero__bg::before, .hero__orb, .hero__cue .chev { animation: none !important; }
  .hero .anim-up { animation: none !important; opacity: 1; transform: none; }
  .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
  * { scroll-behavior: auto !important; }
}

/* =========================================================================
   COVERAGE MAP · IMAGE SLOTS · ESTIMATE WIZARD · SERVICE FAQ
   ========================================================================= */

/* ---------- Coverage map ---------- */
.coverage { display: grid; grid-template-columns: 1.05fr 1fr; gap: 40px; align-items: center; }
.coverage__map { position: relative; aspect-ratio: 1 / 1; max-width: 460px; margin: 0 auto; width: 100%;
  background: radial-gradient(circle at 50% 50%, var(--bg-navy-tint), #fff 70%); border-radius: 50%; border: 1px solid var(--line); }
.cov-ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); border: 1px dashed rgba(16,49,91,.18); border-radius: 50%; }
.cov-ring.r1 { width: 40%; height: 40%; } .cov-ring.r2 { width: 66%; height: 66%; } .cov-ring.r3 { width: 92%; height: 92%; }
.cov-hq { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: var(--navy); color: #fff;
  font-weight: 800; font-size: .82rem; padding: 8px 14px; border-radius: 999px; display: flex; flex-direction: column; align-items: center; line-height: 1; box-shadow: var(--shadow); z-index: 3; }
.cov-hq small { font-weight: 600; font-size: .62rem; color: var(--orange); letter-spacing: .1em; margin-top: 3px; }
.cov-pin { position: absolute; transform: translate(-50%,-50%); font-size: .72rem; font-weight: 700; color: var(--navy);
  background: #fff; border: 1px solid var(--line); padding: 3px 8px 3px 6px; border-radius: 999px; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 5px; box-shadow: var(--shadow); transition: transform .15s ease, border-color .15s ease; }
.cov-pin:hover { border-color: var(--orange); color: var(--orange-dark); text-decoration: none; transform: translate(-50%,-50%) scale(1.08); z-index: 4; }
.cov-pin .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 0 0 rgba(232,118,26,.5); animation: pinPulse 2.4s ease-out infinite; }
@keyframes pinPulse { 0% { box-shadow: 0 0 0 0 rgba(232,118,26,.5); } 70% { box-shadow: 0 0 0 8px rgba(232,118,26,0); } 100% { box-shadow: 0 0 0 0 rgba(232,118,26,0); } }
@media (max-width: 820px) { .coverage { grid-template-columns: 1fr; } .coverage__map { max-width: 340px; } .cov-pin { font-size: .64rem; } }

/* ---------- Image slots (polished artwork until real photos drop in) ---------- */
.img-slot { position: relative; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line);
  background: var(--navy); margin: 0; }
.img-slot.ratio-wide { aspect-ratio: 16 / 9; }
.img-slot.ratio-square { aspect-ratio: 1 / 1; }
.img-slot .slot-art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.img-slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.slot-badge { position: absolute; left: 14px; bottom: 14px; width: 46px; height: 46px; border-radius: 12px;
  background: #fff; display: grid; place-items: center; font-size: 1.5rem; box-shadow: var(--shadow); z-index: 2; }
.slot-cap { position: absolute; right: 12px; bottom: 12px; background: rgba(10,31,60,.72); color: #fff;
  font-size: .78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; z-index: 2; }

/* ---------- Estimate wizard ---------- */
.wizard { position: relative; }
.wiz-prog { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 8px; }
.wiz-prog span { display: block; height: 100%; width: 33%; background: linear-gradient(90deg, var(--orange), #ffa24d); transition: width .35s cubic-bezier(.2,.7,.2,1); }
.wiz-count { font-size: .82rem; color: var(--muted); margin-bottom: 16px; font-weight: 600; }
.wiz-step { border: 0; padding: 0; margin: 0; }
.wizard.js .wiz-step { display: none; animation: fadeSwap .35s ease; }
.wizard.js .wiz-step.active { display: block; }
.wiz-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 6px; }

.wiz-review b { color: var(--ink); }
.pest-choice { display: flex; flex-wrap: wrap; gap: 8px; }
.pest-choice label { border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: .9rem; font-weight: 600; }
.pest-choice input { position: absolute; opacity: 0; }
.pest-choice input:checked + span { color: var(--orange-dark); }
.pest-choice label:has(input:checked) { border-color: var(--orange); background: #fff4e8; }

/* ---------- Service mini-FAQ reuses .accordion ---------- */
.service-faq { margin-top: 40px; }

/* ---------- Header call button + coverage caption (audit polish) ---------- */
.nav-call { color: #fff; font-weight: 800; font-size: .95rem; padding: 8px 14px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,.28); white-space: nowrap; }
.nav-call:hover { color: var(--orange); border-color: var(--orange); text-decoration: none; }
@media (max-width: 980px) { .nav-call { display: none; } }  /* topbar + mobile bar already carry the phone */
.cov-scale { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
  font-size: .68rem; color: var(--muted); background: rgba(255,255,255,.8); padding: 2px 10px; border-radius: 999px; white-space: nowrap; }

/* =========================================================================
   SERVICES MEGA-MENU
   ========================================================================= */
.has-mega { position: relative; }
.mega-toggle { display: inline-flex; align-items: center; gap: 5px; }
.mega-toggle .caret { font-size: .7em; transition: transform .2s ease; }
.has-mega:hover .mega-toggle .caret, .has-mega.open .mega-toggle .caret { transform: rotate(180deg); }
.mega {
  position: absolute; top: calc(100% + 10px); left: 0; min-width: 660px; max-width: 92vw;
  background: #fff; border: 1px solid var(--line); border-radius: 14px;

}
.mega::before { /* hover bridge so the menu doesn't close in the gap */

}
.has-mega:hover .mega, .has-mega.open .mega { display: block; }
.mega-inner { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.mega-col .mega-head {

}

.mega-col li a {
  display: flex; align-items: center; gap: 9px; color: var(--ink); font-weight: 600;

}
.mega-col li a:hover { background: var(--bg-soft); color: var(--orange-dark); text-decoration: none; }

@media (max-width: 640px) {
  .mega {
    position: static; min-width: 0; box-shadow: none; border: 0; padding: 6px 0 4px;
    background: transparent; display: none;
  }
  .has-mega:hover .mega { display: none; }        /* no hover-open on touch */
  .has-mega.open .mega { display: block; }
  .mega-inner { grid-template-columns: 1fr; gap: 8px; }

<script>
/* Small, dependency-free site scripts. */
function initMain() {
  // Mobile navigation toggle
  var toggle = document.querySelector('.nav-toggle');
  var links = document.querySelector('.nav-links');
  if (toggle && links) {
    toggle.addEventListener('click', function () {
      var open = links.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }

  // Auto-fill the current year in the footer
  var yr = document.querySelectorAll('[data-year]');
  var now = new Date().getFullYear();
  yr.forEach(function (el) { el.textContent = now; });

  // Progressive-enhancement contact form.
  // Until a server-side handler is wired up (Part 1, Sec 5 of the brief, or
  // API Gateway + SES), this composes an email to the office so the form is
  // never a dead end. Swap this for a POST handler when the backend is ready.
  var form = document.querySelector('form[data-estimate]');
  if (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var get = function (n) { var el = form.elements[n]; return el ? el.value.trim() : ''; };
      var lines = [
        'Name: ' + get('name'),
        'Phone: ' + get('phone'),
        'Email: ' + get('email'),
        'Service: ' + get('service')
      ];
      if (get('pest')) lines.push('Seeing: ' + get('pest'));
      if (get('city')) lines.push('City: ' + get('city'));
      var body = lines.join('\n') + '\n\n' + get('message');
      var subject = 'Free estimate request' + (get('name') ? ' — ' + get('name') : '');
      window.location.href =
        'mailto:office@excelpest-lawncontrol.com' +
        '?subject=' + encodeURIComponent(subject) +
        '&body=' + encodeURIComponent(body);
      var note = form.querySelector('[data-form-note]');
      if (note) {
        note.textContent = 'Opening your email app… if nothing happens, call (737) 201-3059.';
      }
    });
  }
}
/* =========================================================================
   Austin Excel Pest & Lawn Control — interactive + motion engine
   Vanilla JS, no dependencies. Decorative motion respects reduced-motion.
   ========================================================================= */
function initInteractive() {
  "use strict";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var B = (typeof window !== "undefined" && window.__BASE__) ? window.__BASE__ : "";  // sub-path host prefix
  var $ = function (s, c) { return (c || document).querySelector(s); };
  var $$ = function (s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); };

  /* ---------- Scroll progress bar ---------- */
  var bar = $(".scroll-progress");
  /* ---------- Header shrink ---------- */
  var header = $(".site-header");
  /* ---------- Back to top ---------- */
  var toTop = $(".to-top");

  function onScroll() {
    var st = window.pageYOffset || document.documentElement.scrollTop;
    if (bar) {
      var h = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.width = (h > 0 ? (st / h) * 100 : 0) + "%";
    }
    if (header) header.classList.toggle("is-stuck", st > 10);
    if (toTop) toTop.classList.toggle("show", st > 600);
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();

  if (toTop) {
    toTop.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
    });
  }

  /* ---------- Scroll reveal ---------- */
  var revealSel = ".section > .container > .grid > *, .card, .review-card, .stat, .offer-strip, " +
                  ".crosslink, .spotlight, .flow .step, .pest-panel, .checker, .section-head, .prose";
  if (!reduce && "IntersectionObserver" in window) {
    var targets = $$(revealSel).filter(function (el) { return !el.closest(".site-footer"); });
    targets.forEach(function (el, i) {
      el.classList.add("reveal");
      if (el.parentElement && el.parentElement.matches(".grid, .flow, .pest-grid")) {
        el.classList.add("d" + ((i % 4) + 1));
      }
    });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -8% 0px" });
    targets.forEach(function (el) { io.observe(el); });
    // Safety: reveal everything after 4s in case something is missed
    setTimeout(function () { targets.forEach(function (el) { el.classList.add("in"); }); }, 4000);
  }

  /* ---------- Count-up stats ---------- */
  function animateCount(el) {
    var target = parseFloat(el.getAttribute("data-count"));
    var decimals = (el.getAttribute("data-decimals") | 0);
    var suffix = el.getAttribute("data-suffix") || "";
    var dur = 1400, start = null;
    if (reduce) { el.textContent = target.toFixed(decimals) + suffix; return; }
    function tick(ts) {
      if (!start) start = ts;
      var p = Math.min((ts - start) / dur, 1);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (target * eased).toFixed(decimals) + suffix;
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = target.toFixed(decimals) + suffix;
    }
    requestAnimationFrame(tick);
  }
  var counters = $$("[data-count]");
  if (counters.length) {
    if ("IntersectionObserver" in window) {
      var cio = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { animateCount(e.target); cio.unobserve(e.target); }
        });
      }, { threshold: 0.5 });
      counters.forEach(function (el) { cio.observe(el); });
    } else {
      counters.forEach(animateCount);
    }
  }

  /* ---------- Pest identifier ---------- */
  var pestGrid = $("[data-pest-grid]");
  var pestPanel = $("[data-pest-panel]");
  if (pestGrid && pestPanel) {
    var buttons = $$(".pest-btn", pestGrid);
    function showPest(btn) {
      buttons.forEach(function (b) { b.classList.remove("active"); b.setAttribute("aria-pressed", "false"); });
      btn.classList.add("active"); btn.setAttribute("aria-pressed", "true");
      pestPanel.innerHTML =
        '<div class="fade-swap">' +
          '<div class="emo-lg">' + btn.getAttribute("data-emo") + '</div>' +
          '<h3>' + btn.getAttribute("data-name") + '</h3>' +
          '<p><strong>Signs:</strong> ' + btn.getAttribute("data-signs") + '</p>' +
          '<p>' + btn.getAttribute("data-desc") + '</p>' +
          '<a class="btn btn--primary" href="' + btn.getAttribute("data-href") + '">' +
            btn.getAttribute("data-cta") + ' →</a>' +
        '</div>';
    }
    buttons.forEach(function (b) {
      b.addEventListener("click", function () { showPest(b); });
    });
    if (buttons[0]) showPest(buttons[0]);
  }

  /* ---------- Service-area checker ---------- */
  var checker = $("[data-checker]");
  if (checker) {
    var input = $("input", checker);
    var result = $(".checker__result", checker);
    var cities = JSON.parse(checker.getAttribute("data-cities") || "[]");   // [{name, slug}]
    var zipHint = /^\d{5}$/;
    function normalize(s) { return s.toLowerCase().replace(/[^a-z0-9]/g, ""); }
    function check(e) {
      if (e) e.preventDefault();
      var raw = (input.value || "").trim();
      if (!raw) { result.className = "checker__result"; result.textContent = ""; return; }
      var n = normalize(raw);
      var match = null;
      for (var i = 0; i < cities.length; i++) {
        if (normalize(cities[i].name) === n || normalize(cities[i].name).indexOf(n) === 0) { match = cities[i]; break; }
      }
      if (match && match.slug) {
        result.className = "checker__result hit";
        result.innerHTML = '✓ Yes — we\'ve served <span class="chip">' + match.name +
          '</span> since 1998. <a href="' + B + '/locations/' + match.slug + '.html">See your local page →</a>';
      } else if (match) {
        result.className = "checker__result hit";
        result.innerHTML = '✓ Yes — <span class="chip">' + match.name +
          '</span> is in our service area. <a href="' + B + '/contact.html">Get a free estimate →</a>';
      } else if (zipHint.test(raw)) {
        result.className = "checker__result miss";
        result.innerHTML = 'We serve much of Central Texas around Buda, Kyle &amp; San Marcos. ' +
          'Give us your ZIP by phone: <a href="tel:+17372013059">(737) 201-3059</a>.';
      } else {
        result.className = "checker__result miss";
        result.innerHTML = 'We may reach you — we cover 27 Central Texas cities. ' +
          '<a href="' + B + '/service-area.html">See the full area</a> or <a href="' + B + '/contact.html">ask us</a>.';
      }
    }
    checker.addEventListener("submit", check);
    var go = $("[data-checker-go]", checker);
    if (go) go.addEventListener("click", check);
  }

  /* ---------- Testimonial spotlight ---------- */
  var spot = $("[data-spotlight]");
  if (spot) {
    var slides = $$(".spotlight__slide", spot);
    var dotsWrap = $(".spotlight__dots", spot);
    var idx = 0, timer = null;
    slides.forEach(function (_, i) {
      var d = document.createElement("button");
      d.setAttribute("aria-label", "Show review " + (i + 1));
      d.addEventListener("click", function () { go(i); rearm(); });
      dotsWrap.appendChild(d);
    });
    var dots = $$("button", dotsWrap);
    function go(i) {
      slides[idx].classList.remove("on"); dots[idx].classList.remove("on");
      idx = (i + slides.length) % slides.length;
      slides[idx].classList.add("on"); dots[idx].classList.add("on");
    }
    function rearm() {
      if (reduce || slides.length < 2) return;
      clearInterval(timer);
      timer = setInterval(function () { go(idx + 1); }, 6000);
    }
    go(0); rearm();
  }

  /* ---------- Hero parallax ---------- */
  var heroBg = $(".hero__bg");
  var orbs = $$(".hero__orb");
  if (!reduce && (heroBg || orbs.length)) {
    window.addEventListener("scroll", function () {
      var y = window.pageYOffset || 0;
      if (y > 800) return;
      if (heroBg) heroBg.style.transform = "translateY(" + (y * 0.18) + "px)";
      orbs.forEach(function (o, i) { o.style.transform = "translateY(" + (y * (0.08 + i * 0.05)) + "px)"; });
    }, { passive: true });
  }

  /* ---------- Multi-step estimate wizard ---------- */
  var wiz = $("[data-wizard]");
  if (wiz) {
    wiz.classList.add("js");
    var steps = $$(".wiz-step", wiz);
    var fill = $("[data-wiz-fill]", wiz);
    var count = $("[data-wiz-count]", wiz);
    var review = $("[data-wiz-review]", wiz);
    var cur = 0;

    function validStep() {
      var req = $$("[required]", steps[cur]);

      else if (cur > 0) { cur--; render(); }
    });

  }

wned and locally operated, and they mean it \u2014\n           Gye Hutson is married with three daughters. His philosophy is the throughline of everything we do: he\n           treats <em>every home as if it were his own, and every customer \u2014 and their four-legged family\n           members \u2014 like neighbors.</em> That is why our products are water-based and chosen with pets and kids\n           in mind.</p>\n        <div class=\"callout\">\n          <strong>The people you'll deal with.</strong> Megan Avery, our Director of Office Operations, runs the office\n          for both brands \u2014 customers name-check her in their reviews \u2014 and our technicians are the same familiar\n          faces on every visit.\n        </div>\n        <p>Twenty-eight years in, we hold a 5.0 rating across 41 Google reviews and an A+ from the BBB.\n           We are licensed and insured in Texas (TPCL 0786979). We are proud of it \u2014 and we would rather earn your\n           trust one visit at a time than act like a franchise that just moved to town.</p>\n        <div class=\"hero__actions\">\n          <a class=\"btn btn--primary\" href=\"/contact.html\">Get a free estimate</a>\n          <a class=\"btn btn--outline\" href=\"/reviews.html\">Read our reviews</a>\n        </div>\n      </div>\n      <div>\n        <figure class=\"img-slot ratio-square\" data-filename=\"photos/gye-hutson.webp\"><!-- IMAGE SLOT (PHOTO): photos/gye-hutson.webp \u2014 Real portrait photo of owner Gye Hutson (client to supply). --><svg class=\"slot-art\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"Gye Hutson, owner of Excel Pest &amp; Lawn Control\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"200\" height=\"200\" fill=\"#eef2f9\"/><circle cx=\"100\" cy=\"150\" r=\"66\" fill=\"#0a1f44\"/><circle cx=\"100\" cy=\"76\" r=\"38\" fill=\"#0a1f44\"/><circle cx=\"100\" cy=\"100\" r=\"92\" fill=\"none\" stroke=\"#f26419\" stroke-width=\"6\" opacity=\"0.5\"/></svg></figure>\n        <p sty  bark scorpion.</p>\n          <a class=\"card__link\" href=\"/services/scorpion-control.html\">Learn more \u2192</a>\n        </article>        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\udeb5</div>\n          <h3>Termite Control</h3>\n          <p>Subterranean termites are the quiet, expensive threat to a Central Texas home.</p>\n          <a class=\"card__link\" href=\"/services/termite-control.html\">Learn more \u2192</a>\n        </article>        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83d\udcc4</div>\n          <h3>Termite Letters (WDI)</h3>\n          <p>A home sale in Texas often needs a WDI report \u2014 the official &quot;termite letter&quot; a lender or title company requires before closing.</p>\n          <a class=\"card__link\" href=\"/services/termite-letters.html\">Learn more \u2192</a>\n        </article>        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83d\udc00</div>\n          <h3>Rodent Removal</h3>\n          <p>Scratching in the attic at night, droppings in the pantry, chewed wiring \u2014 rats and mice do real damage fast, and they breed even faster.</p>\n          <a class=\"card__link\" href=\"/services/rodent-removal.html\">Learn more \u2192</a>\n        </article>        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\uddf0</div>\n          <h3>Rodent Exclusion</h3>\n          <p>Trapping without sealing is a treadmill \u2014 new rodents follow the same trails right back inside.</p>\n          <a class=\"card__link\" href=\"/services/rodent-exclusion.html\">Learn more \u2192</a>\n        </article>        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\udd9d</div>\n          <h3>Wildlife Live Trapping</h3>\n          <p>Raccoons in the attic, squirrels in the soffit, opossums under the deck \u2014 Central Texas wildlife treats homes like the hollow trees they replaced.</p>\n          <a class=\"card__link\" href=\"/services/wildlife-live-trapping.html\">Learn more \u2192</a>\n        </article>        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\udd9f</div>\n          <h3>Mosquito Misting Systems</h3>\n          <p>Central Texas humidity and standing water turn a backyard into a mosquito nursery from spring through the first cold snap.</p>\n          <a class=\"card__link\" href=\"/services/mosquito-misting.html\">Learn more \u2192</a>\n        </article>        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83c\udf31</div>\n          <h3>Lawn Pest Control</h3>\n          <p>A brown patch that spreads in the July heat usually is not just the drought \u2014 it is chinch bugs, grubs, or armyworms working under the surface.</p>\n          <a class=\"card__link\" href=\"/services/lawn-pest-control.html\">Learn more \u2192</a>\n        </article>        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83d\udc1c</div>\n          <h3>Ant Control</h3>\n          <p>From fire-ant mounds in the yard to sugar ants marching across the kitchen counter, ants are the most common call we get in Central Texas.</p>\n          <a class=\"card__link\" href=\"/services/ant-control.html\">Learn more \u2192</a>\n        </article>        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\udeb3</div>\n          <h3>Cockroach Control</h3>\n          <p>Roaches are more than a gross surprise at 2 a.m.</p>\n          <a class=\"card__link\" href=\"/services/cockroach-control.html\">Learn more \u2192</a>\n        </article>        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\udd97</div>\n          <h3>Cricket Control</h3>\n          <p>Every late summer, field crickets swarm Central Texas by the thousands \u2014 piling at doorways, under lights and inside garages.</p>\n          <a class=\"card__link\" href=\"/services/cricket-control.html\">Learn more \u2192</a>\n        </article>        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83d\udc3e</div>\n          <h3>Flea Control</h3>\n          <p>Fleas don&#x27;t just bite pets \u2014 they infest carpet, bedding and yards, and a few can become thousands in weeks.</p>\n          <a class=\"card__link\" href=\"/services/flea-control.html\">Learn more \u2192</a>\n        </article>        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83d\udd77\ufe0f</div>\n          <h3>Spider Control</h3>\n          <p>A few spiders keep other bugs down; a lot of spiders \u2014 or a black widow by the garage \u2014 is a different story.</p>\n          <a class=\"card__link\" href=\"/services/spider-control.html\">Learn more \u2192</a>\n        </article>        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83d\udd78\ufe0f</div>\n          <h3>Tick Control</h3>\n          <p>Ticks turn a backyard, greenbelt edge or wooded lot into a health risk for your family and pets.</p>\n          <a class=\"card__link\" href=\"/services/tick-control.html\">Learn more \u2192</a>\n        </article>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"section\">\n    <div class=\"container\">\n      <div class=\"section-head text-center\" style=\"max-width:660px;margin:0 auto 34px;\">\n        <span class=\"eyebrow\">Find your pest</span>\n        <h2>What's bugging you?</h2>\n        <p class=\"lead\">Tap what you're seeing \u2014 we'll show you the signs and the fix.</p>\n      </div>\n      <div class=\"identifier\">\n        <div class=\"pest-grid\" data-pest-grid>\n        <button class=\"pest-btn\" aria-pressed=\"false\" data-emo=\"\ud83e\udd82\" data-name=\"Scorpions\" data-signs=\"Sightings in bathtubs, closets and along baseboards, especially after rain or drought.\" data-desc=\"The striped bark scorpion thrives in Hill Country limestone and slips inside through tiny gaps. We treat harborage and seal them out.\" data-href=\"/services/scorpion-control.html\" data-cta=\"See scorpion control\"><span class=\"emo\">\ud83e\udd82</span>Scorpions</button>\n        <button class=\"pest-btn\" aria-pressed=\"false\" data-emo=\"\ud83d\udc1c\" data-name=\"Ants\" data-signs=\"Trails along counters and foundations, mounds in the yard, or ants around pet bowls.\" data-desc=\"Central Texas ants range from nuisance trails to fire ants. We treat the colony at the source, inside and out.\" data-href=\"/services/ant-control.html\" data-cta=\"See ant control\"><span class=\"emo\">\ud83d\udc1c</span>Ants</button>\n        <button class=\"pest-btn\" aria-pressed=\"false\" data-emo=\"\ud83e\udeb3\" data-name=\"Cockroaches\" data-signs=\"Roaches at night in the kitchen or bath, egg cases, or a musty odor.\" data-desc=\"Roaches love our warm, humid stretches. Our treatments target where they hide and breed, not just where you see them.\" data-href=\"/services/cockroach-control.html\" data-cta=\"See cockroach control\"><span class=\"emo\">\ud83e\udeb3</span>Cockroaches</button>\n        <button class=\"pest-btn\" aria-pressed=\"false\" data-emo=\"\ud83d\udc00\" data-name=\"Rodents\" data-signs=\"Droppings, gnaw marks, scratching in the attic or walls at night.\" data-desc=\"Rats and mice chew wiring and foul insulation. We remove them and seal the entry points so they don&#x27;t return.\" data-href=\"/services/rodent-removal.html\" data-cta=\"See rodent control\"><span class=\"emo\">\ud83d\udc00</span>Rodents</button>\n        <button class=\"pest-btn\" aria-pressed=\"false\" data-emo=\"\ud83e\udeb5\" data-name=\"Termites\" data-signs=\"Mud tubes on the foundation, hollow-sounding wood, or a swarm after spring rain.\" data-desc=\"Subterranean termites work out of sight for years. A licensed inspection tells you where you stand \u2014 and we treat and warranty it.\" data-href=\"/services/termite-control.html\" data-cta=\"See termite control\"><span class=\"emo\">\ud83e\udeb5</span>Termites</button>\n        <button class=\"pest-btn\" aria-pressed=\"false\" data-emo=\"\ud83d\udd77\ufe0f\" data-name=\"Spiders\" data-signs=\"Webs in corners, garages and eaves; egg sacs; more sightings in fall.\" data-desc=\"Spiders follow other insects indoors. Our exterior barrier reduces the prey that draws them in.\" data-href=\"/services/spider-control.html\" data-cta=\"See spider control\"><span class=\"emo\">\ud83d\udd77\ufe0f</span>Spiders</button>\n        <button class=\"pest-btn\" aria-pressed=\"false\" data-emo=\"\ud83e\udd9f\" data-name=\"Mosquitoes\" data-signs=\"Bites at dusk, swarms near standing water, a backyard you can&#x27;t use.\" data-desc=\"We treat breeding sites and install misting systems that keep the yard usable all season.\" data-href=\"/services/mosquito-misting.html\" data-cta=\"See mosquito control\"><span class=\"emo\">\ud83e\udd9f</span>Mosquitoes</button>\n        <button class=\"pest-btn\" aria-pressed=\"false\" data-emo=\"\ud83e\udd9d\" data-name=\"Wildlife\" data-signs=\"Noises in the attic, torn soffits or vents, animals under the deck.\" data-desc=\"Raccoons, squirrels and opossums treat homes like hollow trees. We remove them humanely and close the entry points.\" data-href=\"/services/wildlife-live-trapping.html\" data-cta=\"See wildlife removal\"><span class=\"emo\">\ud83e\udd9d</span>Wildlife</button>\n        <button class=\"pest-btn\" aria-pressed=\"false\" data-emo=\"\ud83c\udf31\" data-name=\"Lawn pests\" data-signs=\"Spreading brown patches, spongy turf, or moths lifting off the grass at dusk.\" data-desc=\"Chinch bugs, grubs and armyworms damage turf from below. We diagnose the real cause and treat it.\" data-href=\"/services/lawn-pest-control.html\" data-cta=\"See lawn pest control\"><span class=\"emo\">\ud83c\udf31</span>Lawn pests</button>\n        </div>\n        <div class=\"pest-panel\" data-pest-panel aria-live=\"polite\"></div>\n      </div>\n    </div>\n  </  <a class=\"card__link\" href=\"/services/ant-control.html\">Learn more \u2192</a>\n        </article>\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\udeb3</div>\n          <h3>Cockroach Control</h3>\n          <p>Roaches are more than a gross surprise at 2 a.m.</p>\n          <a class=\"card__link\" href=\"/services/cockroach-control.html\">Learn more \u2192</a>\n        </article>\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\udd97</div>\n          <h3>Cricket Control</h3>\n          <p>Every late summer, field crickets swarm Central Texas by the thousands \u2014 piling at doorways, under lights and inside garages.</p>\n          <a class=\"card__link\" href=\"/services/cricket-control.html\">Learn more \u2192</a>\n        </article>\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83d\udc3e</div>\n          <h3>Flea Control</h3>\n          <p>Fleas don&#x27;t just bite pets \u2014 they infest carpet, bedding and yards, and a few can become thousands in weeks.</p>\n          <a class=\"card__link\" href=\"/services/flea-control.html\">Learn more \u2192</a>\n        </article>\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\udd82</div>\n          <h3>Scorpion Control</h3>\n          <p>If you live west of I-35, you know the striped bark scorpion.</p>\n          <a class=\"card__link\" href=\"/services/scorpion-control.html\">Learn more \u2192</a>\n        </article>\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83d\udd77\ufe0f</div>\n          <h3>Spider Control</h3>\n          <p>A few spiders keep other bugs down; a lot of spiders \u2014 or a black widow by the garage \u2014 is a different story.</p>\n          <a class=\"card__link\" href=\"/services/spider-control.html\">Learn more \u2192</a>\n        </article>\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\udeb5</div>\n          <h3>Termite Control</h3>\n          <p>Subterranean termites are the quiet, expensive threat to a Central Texas home.</p>\n          <a class=\"card__link\" href=\"/services/termite-control.html\">Learn more \u2192</a>\n        </article>\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83d\udd78\ufe0f</div>\n          <h3>Tick Control</h3>\n          <p>Ticks turn a backyard, greenbelt edge or wooded lot into a health risk for your family and pets.</p>\n          <a class=\"card__link\" href=\"/services/tick-control.html\">Learn more \u2192</a>\n        </article>\n      </div>\n      <div class=\"section-head\" style=\"margin:36px 0 18px;\"><h2>Rodent &amp; Wildlife</h2></div>\n      <div class=\"grid grid--4\">\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83d\udc00</div>\n          <h3>Rodent Removal</h3>\n          <p>Scratching in the attic at night, droppings in the pantry, chewed wiring \u2014 rats and mice do real damage fast, and they breed even faster.</p>\n          <a class=\"card__link\" href=\"/services/rodent-removal.html\">Learn more \u2192</a>\n        </article>\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\uddf0</div>\n          <h3>Rodent Exclusion</h3>\n          <p>Trapping without sealing is a treadmill \u2014 new rodents follow the same trails right back inside.</p>\n          <a class=\"card__link\" href=\"/services/rodent-exclusion.html\">Learn more \u2192</a>\n        </article>\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\udd9d</div>\n          <h3>Wildlife Live Trapping</h3>\n          <p>Raccoons in the attic, squirrels in the soffit, opossums under the deck \u2014 Central Texas wildlife treats homes like the hollow trees they replaced.</p>\n          <a class=\"card__link\" href=\"/services/wildlife-live-trapping.html\">Learn more \u2192</a>\n        </article>\n      </div>\n      <div class=\"section-head\" style=\"margin:36px 0 18px;\"><h2>More Services</h2></div>\n      <div class=\"grid grid--4\">\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83d\udc1c</div>\n          <h3>General Pest Control</h3>\n          <p>Central Texas homes face a year-round rotation of pests \u2014 ants in spring, crickets and scorpions in the late-summer heat, spiders and roaches as it cools.</p>\n          <a class=\"card__link\" href=\"/services/pest-control.html\">Learn more \u2192</a>\n        </article>\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\udd9f</div>\n          <h3>Mosquito Misting Systems</h3>\n          <p>Central Texas humidity and standing water turn a backyard into a mosquito nursery from spring through the first cold snap.</p>\n          <a class=\"card__link\" href=\"/services/mosquito-misting.html\">Learn more \u2192</a>\n        </article>\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83d\udcc4</div>\n          <h3>Termite Letters (WDI)</h3>\n          <p>A home sale in Texas often needs a WDI report \u2014 the official &quot;termite letter&quot; a lender or title company requires before closing.</p>\n          <a class=\"card__link\" href=\"/services/termite-letters.html\">Learn more \u2192</a>\n        </article>\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83c\udf31</div>\n          <h3>Lawn Pest Control</h3>\n          <p>A brown patch that spreads in the July heat usually is not just the drought \u2014 it is chinch bugs, grubs, or armyworms working under the surface.</p>\n          <a class=\"card__link\" href=\"/services/lawn-pest-control.html\">Learn more \u2192</a>\n        </article>\n      </div>\n      <div style=\"margin-top:32px;\">\n      <div class=\"crosslink\">\n        <span class=\"eyebrow\">Need rentColor\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"><path d=\"M-2 40 q-16 -18 -28 -20\"/><path d=\"M-2 52 q-16 18 -28 20\"/><path d=\"M24 32 l-18 -22\"/><path d=\"M42 30 l-8 -28\"/><path d=\"M60 30 l6 -28\"/><path d=\"M24 60 l-18 22\"/><path d=\"M42 62 l-8 28\"/><path d=\"M60 62 l6 28\"/></g></g></g><path d=\"M0 176 Q100 140 200 168 T400 158 V225 H0 Z\" fill=\"rgba(255,255,255,0.05)\"/><path d=\"M0 196 Q120 168 240 190 T400 184 V225 H0 Z\" fill=\"rgba(0,0,0,0.14)\"/></svg><span class=\"slot-badge\" aria-hidden=\"true\">\ud83d\udc1c</span></figure></div>\n  </section>\n  <section class=\"section\">\n    <div class=\"container split\">\n      <div class=\"prose\">\n        <p class=\"lead\">From fire-ant mounds in the yard to sugar ants marching across the kitchen counter, ants are the most common call we get in Central Texas. Killing the trail you can see does nothing \u2014 the colony just sends more. We treat the source.</p>\n        <h2>Why the ants keep coming back</h2><p>Spraying a visible trail kills a few foragers while the colony \u2014 often thousands strong and hidden in a wall, slab or yard mound \u2014 keeps producing more. We use baits and non-repellent products the ants carry back to the nest, so the colony collapses instead of just relocating.</p><h2>Fire ants and Central Texas yards</h2><p>Fire ants are their own problem here \u2014 painful, fast-spreading, and a hazard for kids and pets. We treat mounds directly and set up a yard program that keeps them from re-establishing through the warm months.</p>\n        <div class=\"callout\">\n          <strong>Safe for your family and pets.</strong> Our products are water-based and chosen with\n          family and four-legged family members in mind \u2014 see <a href=\"/pet-family-safety.html\">pet &amp; family safety</a>.\n        </div>\n        <div class=\"hero__actions\">\n          <a class=\"btn btn--primary\" href=\"/contact.html\">Get My Free Estimate</a>\n          <a class=\"bt pliances, in drains and inside wall voids. We target those harborage points and breeding sites so the population crashes, then set up prevention so it stays gone.</p><h2>Built for Central Texas roaches</h2><p>Our heat and humidity let American 'palmetto' roaches thrive outdoors and wander in, while German roaches ride in on boxes and groceries and breed in kitchens. We treat for both, inside and out.</p>\n        <div class=\"callout\">\n          <strong>Safe for your family and pets.</strong> Our products are water-based and chosen with\n          family and four-legged family members in mind \u2014 see <a href=\"/pet-family-safety.html\">pet &amp; family safety</a>.\n        </div>\n        <div class=\"hero__actions\">\n          <a class=\"btn btn--primary\" href=\"/contact.html\">Get My Free Estimate</a>\n          <a class=\"btn btn--outline\" href=\"tel:+17372013059\">Call (737) 201-3059</a>\n        </div>\n      </div>\n      <div>\n        <div class=\"card\">\n          <h3 class=\"mt-0\">What we handle</h3>\n          <p style=\"margin:0 0 8px;font-weight:600;\">Common issues we treat:</p>\n          <ul class=\"prose\" style=\"margin:0;\"><li>German cockroaches</li><li>American (palmetto) roaches</li><li>Oriental roaches</li><li>Egg cases &amp; harborage</li></ul>\n          <hr style=\"border:0;border-top:1px solid var(--line);margin:18px 0;\">\n          <p style=\"margin:0;\"><strong>Serving:</strong> Buda, Kyle, San Marcos, Dripping Springs, Wimberley and\n             <a href=\"/service-area.html\">all of Central Texas</a>.</p>\n        </div>\n        <div class=\"offer-strip\" style=\"margin-top:18px;\">\n          <div><h3>Heroes save 10%</h3><p class=\"mb-0\" style=\"color:#cdd6e6;\">Military, veterans, first responders, nurses &amp; teachers.</p></div>\n          <a class=\"btn btn--primary\" href=\"/offers.html\">See offer</a>\n        </div>\n      </div>\n    </div>\n  </section>\n  <section class=\"section section--soft\">\n    <div class th d=\"M0 196 Q120 168 240 190 T400 184 V225 H0 Z\" fill=\"rgba(0,0,0,0.14)\"/></svg><span class=\"slot-badge\" aria-hidden=\"true\">\ud83c\udf31</span></figure></div>\n  </section>\n  <section class=\"section\">\n    <div class=\"container split\">\n      <div class=\"prose\">\n        <p class=\"lead\">A brown patch that spreads in the July heat usually is not just the drought \u2014 it is chinch bugs, grubs, or armyworms working under the surface. We treat the pests and the weeds and disease that damage Central Texas turf, so the lawn recovers and holds.</p>\n        <h2>Know what is actually killing the grass</h2><p>St. Augustine and Bermuda each fail in their own way here, and the fix depends on the cause. Chinch bugs cook a lawn in full sun; grubs loosen it from below; brown patch spreads in humidity. We diagnose it first, then treat the right problem.</p><h2>Full landscaping and turf renovation</h2><p>Excel Pest handles the pests, weeds and disease that damage a lawn. For design, installation, sod, and hardscape, our sister company <a href=\"https://researchturfmgmt.com\" rel=\"noopener\">Research Turf Management</a> handles the build side \u2014 many of our customers use both.</p>\n        <div class=\"callout\">\n          <strong>Safe for your family and pets.</strong> Our products are water-based and chosen with\n          family and four-legged family members in mind \u2014 see <a href=\"/pet-family-safety.html\">pet &amp; family safety</a>.\n        </div>\n        <div class=\"hero__actions\">\n          <a class=\"btn btn--primary\" href=\"/contact.html\">Get My Free Estimate</a>\n          <a class=\"btn btn--outline\" href=\"tel:+17372013059\">Call (737) 201-3059</a>\n        </div>\n      </div>\n      <div>\n        <div class=\"card\">\n          <h3 class=\"mt-0\">What we handle</h3>\n          <p style=\"margin:0 0 8px;font-weight:600;\">Common issues we treat:</p>\n          <ul class=\"prose\" style=\"margin:0;\"><li>Chinch bugs</li><li>White grubs</li><li>Armyworms</li><li>Weeds &amp; turf disease (brown patch)</li></ul>\n          <hr style=\"border:0;border-top:1px solid var(--line);margin:18px 0;\">\n          <p style=\"margin:0;\"><strong>Serving:</strong> Buda, Kyle, San Marcos, Dripping Springs, Wimberley and\n             <a href=\"/service-area.html\">all of Central Texas</a>.</p>\n        </div>\n        <div class=\"offer-strip\" style=\"margin-top:18px;\">\n          <div><h3>Heroes save 10%</h3><p class=\"mb-0\" style=\"color:#cdd6e6;\">Military, veterans, first responders, nurses &amp; teachers.</p></div>\n          <a class=\"btn btn--primary\" href=\"/offers.html\">See offer</a>\n        </div>\n      </div>\n    </div>\n  </section>\n  <section class=\"section section--soft\">\n    <div class=\"container\">\n      <h2>Related services</h2>\n      <div class=\"grid grid--3\">\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83d\udc1c</div>\n          <h3>General Pest Control</h3>\n          <a class=\"card__link\" href=\"/services/pest-control.html\">Learn more \u2192</a>\n        </article>\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\udd9f</div>\n          <h3>Mosquito Misting Systems</h3>\n          <a class=\"card__link\" href=\"/services/mosquito-misting.html\">Learn more \u2192</a>\n        </article>\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\udd82</div>\n          <h3>Scorpion Control</h3>\n          <a class=\"card__link\" href=\"/services/scorpion-control.html\">Learn more \u2192</a>\n        </article>\n      </div>\n    </div>\n  </section>\n  <section class=\"section section--soft service-faq\">\n    <div class=\"container\">\n      <div class=\"section-head text-center\" style=\"margin-bottom:26px;\">\n        <span class=\"eyebrow\">Good questions</span>\n        <h2>Lawn Pest Control \u2014 FAQ</h2>\n      </div>\n      <div class=\"accordion\"><d e=\"img\" aria-label=\"Roof rat at the edge of a home attic\" xmlns=\"http://www.w3.org/2000/svg\"><defs><linearGradient id=\"ps\" x1=\"0\" y1=\"0\" x2=\"0.35\" y2=\"1\"><stop offset=\"0\" stop-color=\"#0a1f44\"/><stop offset=\"1\" stop-color=\"#1c3a6e\"/></linearGradient></defs><rect width=\"400\" height=\"225\" fill=\"url(#ps)\"/><circle cx=\"316\" cy=\"58\" r=\"30\" fill=\"#f26419\" opacity=\"0.9\"/><g fill=\"rgba(255,255,255,0.16)\"><g transform=\"translate(120,72)\"><ellipse cx=\"86\" cy=\"58\" rx=\"54\" ry=\"34\"/><circle cx=\"30\" cy=\"52\" r=\"21\"/><circle cx=\"16\" cy=\"30\" r=\"15\"/><path d=\"M138 60 q42 8 62 -18\" stroke=\"currentColor\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\"/></g></g><path d=\"M0 176 Q100 140 200 168 T400 158 V225 H0 Z\" fill=\"rgba(255,255,255,0.05)\"/><path d=\"M0 196 Q120 168 240 190 T400 184 V225 H0 Z\" fill=\"rgba(0,0,0,0.14)\"/></svg><span class=\"slot-badge\" aria-hidden=\"true\">\ud83d\udc00</span></figure></div>\n  </section>\n  <section class=\"section\">\n    <div class=\"container split\">\n      <div class=\"prose\">\n        <p class=\"lead\">Scratching in the attic at night, droppings in the pantry, chewed wiring \u2014 rats and mice do real damage fast, and they breed even faster. We remove the rodents inside now, then seal the gaps so it doesn't repeat.</p>\n        <h2>Removal done right</h2><p>We locate the activity, remove the rodents, and clean up the trails they leave. But removal alone is only half the job \u2014 new rodents follow the same paths back in. That's why we pair it with <a href=\"/services/rodent-exclusion.html\">rodent exclusion</a> to seal them out for good.</p><h2>Why speed matters</h2><p>Rodents breed quickly and gnaw constantly \u2014 including on electrical wiring, a genuine fire risk. The sooner we're in, the less damage and the smaller the population to clear. We also check for the wildlife that uses the same gaps \u2014 see <a href=\"/services/wildlife-live-trapping.html\">wildlife live trapping</a>.</p>\n        <div class=\"callout\">\n          <strong>Safe for your family and pets.</strong> Our products are water-based and chosen with\n          family and four-legged family members in mind \u2014 see <a href=\"/pet-family-safety.html\">pet &amp; family safety</a>.\n        </div>\n        <div class=\"hero__actions\">\n          <a class=\"btn btn--primary\" href=\"/contact.html\">Get My Free Estimate</a>\n          <a class=\"btn btn--outline\" href=\"tel:+17372013059\">Call (737) 201-3059</a>\n        </div>\n      </div>\n      <div>\n        <div class=\"card\">\n          <h3 class=\"mt-0\">What we handle</h3>\n          <p style=\"margin:0 0 8px;font-weight:600;\">Common issues we treat:</p>\n          <ul class=\"prose\" style=\"margin:0;\"><li>Roof rats &amp; house mice</li><li>Attic &amp; wall-void activity</li><li>Droppings &amp; gnaw marks</li><li>Chewed wiring (a fire risk)</li></ul>\n          <hr style=\"border:0;border-top:1px solid var(--line);margin:18px 0;\">\n          <p style=\"margin:0;\"><strong>Serving:</strong> Buda, Kyle, San Marcos, Dripping Springs, Wimberley and\n             <a href=\"/service-area.html\">all of Central Texas</a>.</p>\n        </div>\n        <div class=\"offer-strip\" style=\"margin-top:18px;\">\n          <div><h3>Heroes save 10%</h3><p class=\"mb-0\" style=\"color:#cdd6e6;\">Military, veterans, first responders, nurses &amp; teachers.</p></div>\n          <a class=\"btn btn--primary\" href=\"/offers.html\">See offer</a>\n        </div>\n      </div>\n    </div>\n  </section>\n  <section class=\"section section--soft\">\n    <div class=\"container\">\n      <h2>Related services</h2>\n      <div class=\"grid grid--3\">\n        <article class=\"card card--link\">\n          <div class=\"card__icon\">\ud83e\uddf0</div>\n          <h3>Rodent Exclusion</h3>\n          <a class=\"card__link\" href=\"/services/rodent-exclusion.html\">Learn more \u2192</a>\n        </article>\n        <ar
