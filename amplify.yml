version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Static generator — Python standard library only, nothing to install."
    build:
      commands:
        # Build at the site root (no BASE_PATH) — Amplify serves the custom domain at /.
        - python3 tools/build.py
  artifacts:
    # Everything Amplify serves is the generated ./site folder.
    baseDirectory: site
    files:
      - '**/*'
  cache:
    paths: []
