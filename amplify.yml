version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Static generator — Python standard library only, nothing to install."
    build:
      commands:
        # Build at the site root (no BASE_PATH) — Amplify serves the custom domain at /.
        - python3 tools/build.py
  artifacts:
    # Everything Amplify serves is the generated ./site folder.
    baseDirectory: site
    files:
      - '**/*'
  cache:
    paths: []

# Security response headers (G2 from the site audit). CSP is intentionally left
# off here — a wrong policy would break the PayPal SDK, the Google Maps embed and
# Google Fonts; it should be added deliberately and tested. Amplify serves the
# whole site over HTTPS and re-invalidates its CDN on every deploy.
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Permissions-Policy'
        value: 'geolocation=(), camera=(), microphone=(), payment=(self "https://www.paypal.com")'
  - pattern: '**/*.html'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
