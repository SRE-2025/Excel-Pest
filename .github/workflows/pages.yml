name: Deploy to GitHub Pages

# Builds the site with the /Excel-Pest base path and publishes it to GitHub Pages.
# Gives a live URL: https://sre-2025.github.io/Excel-Pest/
#
# One-time setup if the first run errors on permissions:
#   Repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: ["claude/website-github-aws-setup-j7tr24"]
    paths: ["site/**", "tools/build.py", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site with base path for the project sub-directory
        run: BASE_PATH=/Excel-Pest python3 tools/build.py
      - name: Disable Jekyll processing
        run: touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# re-trigger: awaiting Pages enablement
