name: Deploy to GitHub Pages

# Builds the site at the site root and publishes it to GitHub Pages on the
# custom domain excelpest-lawncontrol.com (see site/CNAME).
#
# One-time setup if the first run errors on permissions:
#   Repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Custom domain: set in Repo Settings -> Pages -> Custom domain (the CNAME file
# does this automatically), then enable "Enforce HTTPS" once the cert provisions.

on:
  push:
    branches: ["claude/website-github-aws-setup-j7tr24"]
    paths: ["site/**", "tools/build.py", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site at the root path (served on the custom domain)
        run: python3 tools/build.py
      - name: Disable Jekyll processing
        run: touch site/.nojekyll
      - name: Ensure custom domain (CNAME) is present in the published output
        run: echo 'excelpest-lawncontrol.com' > site/CNAME
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

