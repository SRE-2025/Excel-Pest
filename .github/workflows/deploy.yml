name: Deploy site to AWS (S3 + CloudFront — alternative)

# NOTE: The active hosting path for this project is AWS Amplify (see
# docs/AMPLIFY.md). This workflow is the ALTERNATIVE S3 + CloudFront path and is
# manual-only (workflow_dispatch) so it never runs or fails automatically.
# It stays here in case you move off Amplify later.
#
# Deploys the static site in ./site to S3 and invalidates CloudFront.
# Authentication uses GitHub OIDC -> an IAM role (no stored AWS keys).
#
# Required repository configuration (Settings -> Secrets and variables -> Actions):
#   Secrets:
#     AWS_DEPLOY_ROLE_ARN      IAM role ARN output by the CloudFormation stack
#     CLOUDFRONT_DISTRIBUTION_ID   CloudFront distribution ID from the stack
#   Variables:
#     AWS_REGION               e.g. us-east-1
#     S3_BUCKET                bucket name output by the CloudFormation stack

on:
  # Manual-only: Amplify is the active path, so this does not auto-run.
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync HTML/text with short cache
        run: |
          aws s3 sync ./site "s3://${{ vars.S3_BUCKET }}" \
            --delete \
            --exclude "*" \
            --include "*.html" --include "*.xml" --include "*.txt" \
            --cache-control "public, max-age=300, must-revalidate"

      - name: Sync static assets with long cache
        run: |
          aws s3 sync ./site "s3://${{ vars.S3_BUCKET }}" \
            --delete \
            --exclude "*.html" --exclude "*.xml" --exclude "*.txt" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

      - name: Summary
        run: echo "Deployed ./site to s3://${{ vars.S3_BUCKET }} and invalidated CloudFront." >> "$GITHUB_STEP_SUMMARY"
